# Render Blueprint for the Milestone 4 RAG chatbot.
#
# Apply from the Render dashboard: New -> Blueprint -> pick this repo.
# Render reads this file, shows GROQ_API_KEY as a field to fill in, and creates
# the service. GROQ_MODEL is deliberately absent - config.py defaults it.
#
# The Python version is pinned by .python-version, not by an env var. Render
# requires a fully qualified version (3.14.7, not 3.14) in PYTHON_VERSION,
# whereas a .python-version file may omit the patch and take the newest
# 3.14.x. That is the safer of the two: requirements.txt is verified against
# 3.14.7 and a new patch release is not a reason to fail the build.

services:
  - type: web
    name: mf-faqs-rag
    runtime: python
    # No India region exists on Render; Singapore is the closest to the users
    # this corpus serves. Changeable only by recreating the service.
    region: singapore
    # 0.1 CPU / 512 MB. Small, but the app serves one request at a time out of
    # a prebuilt vector store - see the cold-start note in the README before
    # assuming this is comfortable.
    plan: free
    branch: master

    # One install, and deliberately not two.
    #
    # This used to pre-install a CPU-only torch wheel from the PyTorch index
    # before requirements.txt, because PyPI's default linux torch wheel
    # bundles several GB of CUDA runtime that this app cannot use. That was
    # correct while the embedding model ran under sentence-transformers.
    # It no longer is: embeddings run on the float32 ONNX export of
    # all-MiniLM-L6-v2 under onnxruntime, so torch is not a dependency at all
    # and the CUDA workaround went with it.
    #
    # This matters for more than build time. torch's runtime needs ~530 MB to
    # serve an 86 MB model, and this plan has 512 MB, so loading it made the
    # process get OOM-killed the instant somebody asked a question - the page
    # rendered perfectly and then silently stopped answering, with no
    # traceback because the kernel ended the process rather than Python. The
    # onnxruntime path peaks at ~254 MB. Keep requirements.txt torch-free.
    buildCommand: pip install --no-cache-dir -r requirements.txt

    # --server.headless is required in a container: without it Streamlit tries
    # to open a browser and to prompt for an email on first run, which has
    # nowhere to go and no terminal to print to.
    startCommand: >-
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    # Streamlit's own liveness endpoint. The default of "/" makes Render
    # execute the whole app script to decide the service is alive, which loads
    # the embedding model on every probe.
    healthCheckPath: /_stcore/health

    autoDeployTrigger: commit

    envVars:
      # sync: false means Render prompts for this in the dashboard instead of
      # taking a value from git. Never put the key in this file: it is in the
      # repository's history if you do.
      - key: GROQ_API_KEY
        sync: false
